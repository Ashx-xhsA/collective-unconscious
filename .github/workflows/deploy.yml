name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image with Paketo
        run: |
          ./mvnw spring-boot:build-image \
            -Dspring-boot.build-image.imageName=zhanyichen/cu-app:${{ github.sha }} \
            -Dspring-boot.build-image.imagePlatform=linux/amd64 \
            -DskipTests

      - name: Tag image as latest
        run: docker tag zhanyichen/cu-app:${{ github.sha }} zhanyichen/cu-app:latest

      - name: Push both tags
        run: |
          docker push zhanyichen/cu-app:${{ github.sha }}
          docker push zhanyichen/cu-app:latest