name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image with Paketo
        run: |
          ./mvnw spring-boot:build-image \
            -Dspring-boot.build-image.imageName=zhanyichen/cu-app:${{ github.sha }} \
            -Dspring-boot.build-image.imagePlatform=linux/amd64 \
            -DskipTests

      - name: Tag image as latest
        run: docker tag zhanyichen/cu-app:${{ github.sha }} zhanyichen/cu-app:latest

      - name: Push both tags
        run: |
          docker push zhanyichen/cu-app:${{ github.sha }}
          docker push zhanyichen/cu-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            docker pull zhanyichen/cu-app:latest
            docker stop cu-app || true
            docker rm cu-app || true
            docker run -d \
              --name cu-app \
              --env-file ~/.env \
              -p 8080:8080 \
              --restart unless-stopped \
              zhanyichen/cu-app:latest
            
            echo "Waiting for app to become healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'; then
                echo "Health check passed after ${i} attempts"
                docker image prune -f
                exit 0
              fi
              echo "Attempt ${i}/30: not ready yet, waiting 2s..."
              sleep 2
            done
              
              echo "Health check FAILED after 60s. Container logs:"
              docker logs cu-app --tail 100
              exit 1