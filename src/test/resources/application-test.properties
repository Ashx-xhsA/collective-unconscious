# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/cu_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ===== Session / Redis =====
# Tests must NOT talk to Redis: no Redis service runs in CI. Spring Boot 4 removed
# `spring.session.store-type`, and having spring-session-data-redis on the classpath would
# otherwise auto-activate a Redis-backed session (+ Redis health check) on startup. Excluding
# these three auto-configurations disables Redis entirely and falls back to an in-memory
# servlet HttpSession — which is all these tests need. Real Redis persistence is verified
# separately (manual / Testcontainers), not here.
spring.autoconfigure.exclude=\
  org.springframework.boot.session.autoconfigure.SessionAutoConfiguration,\
  org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration

# ===== Logging =====
logging.level.root=INFO
logging.level.com.cu=DEBUG