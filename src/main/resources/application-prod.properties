# ===== Database =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# ===== Session =====
# 会话空闲超时:14 天没有任何请求才登出;每次请求都会重置倒计时(sliding)。
# Spring Session 会把这个值作为 Redis 里 session 的 TTL。
server.servlet.session.timeout=14d

# ===== Hikari =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===== Flyway =====
# 让 Flyway 对「已有旧表、还没历史表」的 RDS 自动起步;baseline-version=0 使 V1 照常执行。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===== Logging =====
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.cu=INFO

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===== Error responses =====
server.error.include-stacktrace=never
server.error.include-message=never