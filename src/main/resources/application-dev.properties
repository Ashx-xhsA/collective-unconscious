# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/cu-dev
spring.datasource.username=cu-admin
spring.datasource.password=mypassword

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 会话空闲超时:14 天没有任何请求才登出;每次请求都会重置倒计时(sliding)。
# Spring Session 会把这个值作为 Redis 里 session 的 TTL。
server.servlet.session.timeout=14d

spring.security.user.name =me
spring.security.user.password =thisisme

spring.jpa.hibernate.ddl-auto=validate

# Flyway:让它能对「已有旧表、但还没历史表」的库自动起步。
# baseline-version=0 → V1(版本 1 > 0)照样会跑,V1 里会先 DROP 旧表再重建。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0